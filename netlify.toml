# Hashed build output: the filename changes whenever the bytes do.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Unhashed, so keep it short enough that a replaced logo or OG image
# goes live the same day.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Certificates and forms get replaced in place under the same name.
[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.doc"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
